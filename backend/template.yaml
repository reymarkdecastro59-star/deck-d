AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DECK'D backend - gaming habit tracker

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref DeckdTable
        USER_POOL_ID: !Ref UserPool
        STAGE: !Ref Stage

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  RawgApiKey:
    Type: String
    NoEcho: true
    Default: ""

  BedrockInferenceProfileId:
    Type: String
    Default: apac.anthropic.claude-haiku-4-5-v1:0
    Description: >
      Bedrock cross-region inference profile ID for Claude Haiku 4.5.
      The Lambda constructs the full ARN at cold start from its own
      invoked_function_arn — this parameter only supplies the ID suffix.

Resources:

  # -- Auth --------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub deckd-users-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub deckd-client-${Stage}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days

  # -- Database ----------------------------------------------------------------

  DeckdTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub deckd-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -- API Gateway -------------------------------------------------------------

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub deckd-api-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,DELETE,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Device-Id,X-Device-Name'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      # ---------------------------------------------------------------------------
      # Stage-level throttling (first line of defence against abuse/DoS).
      #
      # These limits apply to the entire API stage, not per-user. The wildcard
      # entry (/*  *) sets a baseline for all endpoints; the /export GET entry
      # tightens the limit for the full-dump endpoint, which is the highest abuse
      # surface.
      #
      # Ordering matters: API Gateway evaluates the most specific path first, so
      # /export GET (rate 5 / burst 10) takes precedence over the wildcard
      # (rate 60 / burst 100).
      #
      # TODO(rate-limits): Per-user throttling is a follow-up task.
      # API Gateway Usage Plans + API Keys do not integrate natively with Cognito
      # JWT authorizers. The recommended path forward is one of:
      #   a) AWS WAF rate-based rules keyed on the "sub" claim (forwarded as a
      #      request header by the Cognito authorizer context).
      #   b) A thin DynamoDB-backed counter in a Lambda middleware / decorator
      #      that rejects requests exceeding per-sub limits before business logic
      #      runs.
      # Either approach should be implemented before the public beta launch.
      # ---------------------------------------------------------------------------
      MethodSettings:
        # Heavy endpoint: full data dump — tight throttle to limit scraping / DoS
        - HttpMethod: GET
          ResourcePath: /export
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        # All other endpoints: accommodates offline queue drain bursts while
        # protecting against runaway clients
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingRateLimit: 60
          ThrottlingBurstLimit: 100

  # -- Lambda Functions --------------------------------------------------------

  SessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-sessions-${Stage}
      CodeUri: src/
      Handler: handlers.sessions.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeckdTable
      Events:
        PostSession:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions
            Method: POST
        PostSessionBatch:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions/batch
            Method: POST
        GetSessions:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions
            Method: GET
        DeleteSession:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions/{session_id}
            Method: DELETE
        PatchSession:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions/{session_id}
            Method: PATCH

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-dashboard-${Stage}
      CodeUri: src/
      Handler: handlers.dashboard.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DeckdTable
      Events:
        GetDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /dashboard
            Method: GET

  ExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-export-${Stage}
      CodeUri: src/
      Handler: handlers.export.handler
      Timeout: 29
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DeckdTable
      Events:
        GetExport:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /export
            Method: GET

  DevicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-devices-${Stage}
      CodeUri: src/
      Handler: handlers.devices.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeckdTable
      Events:
        GetDevices:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /devices
            Method: GET
        PatchDevice:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /devices/{device_id}
            Method: PATCH
        DeleteDevice:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /devices/{device_id}
            Method: DELETE

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-profile-${Stage}
      CodeUri: src/
      Handler: handlers.profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeckdTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /profile
            Method: GET
        PatchProfile:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /profile
            Method: PATCH
        DeleteProfile:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /profile
            Method: DELETE

  RecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-recommendations-${Stage}
      CodeUri: src/
      Handler: handlers.recommendations.handler
      Timeout: 15
      Environment:
        Variables:
          RAWG_API_KEY: !Ref RawgApiKey
          BEDROCK_INFERENCE_PROFILE_ID: !Ref BedrockInferenceProfileId
      # Crud (not Read) because Phases 8b and 8c write per-user cache items
      # (pk=USER#{sub}, sk=RECS#GENRE and RECS#LLM).
      #
      # Bedrock statement: bedrock:InvokeModel only (never bedrock:*), scoped
      # to the Haiku 4.5 model family AND its cross-region inference profile —
      # Bedrock verifies both on invoke. Wildcarded on the version suffix so a
      # Haiku patch upgrade doesn't force a redeploy; the model family stays
      # pinned.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeckdTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Foundation model ARN has NO account segment (Bedrock-managed,
                # not customer-owned) — the double colon is intentional, not
                # a typo. Both resources are verified by Bedrock on invoke,
                # so we grant both.
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-4-5-*
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.anthropic.claude-haiku-4-5-*
      Events:
        GetRecommendations:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recommendations
            Method: GET

  RefreshMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deckd-refresh-metadata-${Stage}
      CodeUri: src/
      Handler: handlers.refresh_metadata.handler
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          RAWG_API_KEY: !Ref RawgApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeckdTable
      Events:
        DailyCron:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 * * ? *)
            Name: !Sub deckd-refresh-metadata-daily-${Stage}
            Description: Daily RAWG metadata refresh at 03:00 UTC

# -- Outputs ------------------------------------------------------------------

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  TableName:
    Description: DynamoDB table name
    Value: !Ref DeckdTable
